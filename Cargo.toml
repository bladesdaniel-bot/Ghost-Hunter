[package]
name = "tcp_sniffer"
version = "0.1.0"
edition = "2021"

[dependencies]
# Existing Sniffer Dependencies
pcap = "0.11.0"          # Native OS packet capture
etherparse = "0.13.0"    # Lightning-fast packet header parser
rusqlite = { version = "0.29.0", features = ["bundled"] } # SQLite Vault

# New Auth Gateway Dependencies
eframe = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
pbkdf2 = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2.5" 

[[bin]]
name = "tcp_sniffer"
path = "src/tcp_sniffer.rs"
